# Project review configuration.
# Path filters keep generated inventories and retained artifacts out of automated
# line review. Artifact families have independent compatibility contracts in
# contracts/artifacts.json.
# Excluded case fixtures still require semantic review during contribution.
# Structural validation cannot establish that a case's expected verdict is right.
reviews:
  path_filters:
    # Case fixtures are structurally checked by make validate-cases.
    # These path filters exclude new cases as well as mechanical fixture updates;
    # maintainers review new case semantics separately.
    - "!cases/**/*.json"
    - "!cases/**/*.yaml"
    # MANIFEST.txt is regenerated by make cases-manifest;
    # STATS.md is regenerated by make stats-update.
    - "!cases/MANIFEST.txt"
    - "!cases/STATS.md"
    # Retained conformance vectors are test fixtures with immutable existing bytes.
    # Review their contract and generator separately from mechanical output.
    - "!control-evidence/v0/conformance/golden/**"
    - "!control-evidence/v0/conformance/edge/**"
    # Published result records, append-only by policy.
    - "!gauntlet-site/results/**"
    # Buyer-report golden files. Regenerated output compared byte-for-byte by
    # the report tests, so reading them reviews the renderer's output rather
    # than the renderer. The renderer itself stays in review.
    - "!runner/testdata/buyer-report/*.golden.md"
    # Embedded schema copies inside a versioned control-evidence verifier. Each
    # is proven byte-identical to its canonical original under schemas/ by
    # TestEmbeddedSchemasMatchCanonicalCopies, and the canonical original IS
    # reviewed. Reviewing both copies spends the budget twice on one decision.
    - "!control-evidence/*/verifier/schemas/*.json"

  # The corpus is the product here, so a walkthrough that lists two hundred
  # fixture paths buries the summary of what actually changed.
  high_level_summary: true
  poem: false
