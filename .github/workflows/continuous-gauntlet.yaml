# SPDX-License-Identifier: Apache-2.0

name: Continuous Gauntlet

on:
  workflow_dispatch:
    inputs:
      corpus_ref:
        description: "Corpus ref to benchmark. Must resolve to origin/main or a tag."
        required: false
        default: main

concurrency:
  group: continuous-gauntlet-${{ github.event.inputs.corpus_ref || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipelock-release:
    name: Pipelock release benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 35 # Keep synchronized with JOB_TIMEOUT_MINUTES below.
    env:
      GAUNTLET_ARTIFACT_DIR: continuous-gauntlet-artifacts
      JOB_TIMEOUT_MINUTES: "35"
    steps:
      - name: Record job budget start
        shell: bash
        run: echo "JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.inputs.corpus_ref || 'main' }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"

      - name: Run portable canonical benchmark
        shell: bash
        run: |
          set -euo pipefail
          job_deadline=$((JOB_STARTED_EPOCH + JOB_TIMEOUT_MINUTES * 60))
          ./scripts/run-pipelock-gauntlet.sh \
            --output-dir "$GAUNTLET_ARTIFACT_DIR" \
            --deadline-epoch "$job_deadline" \
            --reserve-seconds $((6 * 60)) \
            --benchmark-timeout-seconds $((24 * 60))

      - name: Verify the recorded tool version matches the binary that ran
        shell: bash
        run: |
          set -euo pipefail
          # Both artifacts are already captured as evidence and nothing compared
          # them. The profile's tool_version reaches every result row and the
          # signed receipt, so a stale profile publishes a score under a build
          # that never executed the corpus.
          artifact_dir="$GAUNTLET_ARTIFACT_DIR"
          version_file="$artifact_dir/pipelock-version.txt"
          profile_file="$artifact_dir/tool-profile.json"
          test -f "$version_file" || { echo "no recorded binary version at $version_file"; exit 1; }
          test -f "$profile_file" || { echo "no tool profile at $profile_file"; exit 1; }
          # Exactly one canonical record. Several would mean the file was
          # appended to, and comparing a multi-line value is not a comparison.
          records="$(awk '$1 == "pipelock" && $2 == "version" && NF == 3 { print $3 }' "$version_file")"
          record_count="$(printf '%s\n' "$records" | grep -c . || true)"
          if [ "$record_count" -ne 1 ]; then
            echo "expected exactly one 'pipelock version <version>' record in $version_file, found $record_count"
            exit 1
          fi
          binary_version="$(printf '%s' "$records" | sed 's/^v//')"
          profile_version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tool_version"])' "$profile_file")"
          test -n "$binary_version" || { echo "could not read a version from $version_file"; exit 1; }
          test -n "$profile_version" || { echo "tool profile carries no tool_version"; exit 1; }
          # Validate both operands. Comparing without validating lets two
          # identical nonsense values agree and pass, which reads as a match.
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          printf '%s' "$binary_version" | grep -Eq "$semver" || { echo "binary version is not a version: $binary_version"; exit 1; }
          printf '%s' "$profile_version" | grep -Eq "$semver" || { echo "profile tool_version is not a version: $profile_version"; exit 1; }
          if [ "$binary_version" != "$profile_version" ]; then
            echo "tool_version mismatch"
            echo "  profile claims: $profile_version"
            echo "  binary reports: $binary_version"
            echo "update examples/pipelock/tool-profile.json to $binary_version before publishing this run"
            exit 1
          fi
          echo "tool version agrees: $binary_version"

      - name: Finalize GitHub provenance artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$GAUNTLET_ARTIFACT_DIR"
          artifact_json="$artifact_dir/continuous-gauntlet-pipelock.json"
          python3 scripts/build_gauntlet_provenance.py finalize \
            --repo-root . \
            --bundle "$artifact_dir/run-bundle.json" \
            --artifact-id "github-actions:${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --canonical-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --output "$artifact_json"
          {
            echo "ARTIFACT_JSON=$artifact_json"
            echo "DECISION_PATH=$artifact_dir/promotion-decision.json"
          } >> "$GITHUB_ENV"

      - name: Validate generated provenance artifact
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_JSON:-}" || { echo "provenance artifact path was not published by the finalizer"; exit 1; }
          test -f "$ARTIFACT_JSON" || { echo "provenance artifact missing at $ARTIFACT_JSON"; exit 1; }
          python3 scripts/validate_gauntlet_scope.py "$ARTIFACT_JSON"

      - name: Evaluate candidate without publishing
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$GAUNTLET_ARTIFACT_DIR"
          python3 scripts/evaluate_gauntlet_candidate.py evaluate \
            --candidate "$ARTIFACT_JSON" \
            --baseline ci/gauntlet-baseline.json \
            --evidence "raw_summary=$artifact_dir/raw-summary.json" \
            --evidence "results=$artifact_dir/results.jsonl" \
            --evidence "runner_stderr=$artifact_dir/runner.stderr" \
            --evidence "command=$artifact_dir/command.txt" \
            --evidence "stats=$artifact_dir/make-stats.txt" \
            --evidence "case_index=$artifact_dir/case-index.json" \
            --evidence "entrypoint_command=$artifact_dir/entrypoint-command.txt" \
            --evidence "run_metadata=$artifact_dir/run-metadata.json" \
            --evidence "pipelock_release=$artifact_dir/pipelock-release.json" \
            --evidence "release_checksums=$artifact_dir/checksums.txt" \
            --evidence "pipelock_version_output=$artifact_dir/pipelock-version.txt" \
            --evidence "corpus_manifest=$artifact_dir/corpus-manifest.txt" \
            --evidence "tool_profile=$artifact_dir/tool-profile.json" \
            --evidence "capability_registry=$artifact_dir/capability-registry.json" \
            --evidence "receipt_profile=$artifact_dir/receipt-profile.json" \
            --evidence "execution_decision=$artifact_dir/execution-decision.json" \
            --evidence "run_bundle=$artifact_dir/run-bundle.json" \
            --decision "$DECISION_PATH"

      # Earlier failures skip the normal evaluator. Still produce a blocked,
      # machine-readable decision before upload so malformed or partial runs
      # leave an auditable reason instead of only a red job status.
      - name: Ensure fail-closed decision exists
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$GAUNTLET_ARTIFACT_DIR"
          candidate_path="$artifact_dir/continuous-gauntlet-pipelock.json"
          decision_path="$artifact_dir/promotion-decision.json"
          mkdir -p "$artifact_dir"
          if [[ ! -f "$decision_path" ]]; then
            if [[ -f scripts/evaluate_gauntlet_candidate.py ]]; then
              python3 scripts/evaluate_gauntlet_candidate.py evaluate \
                --candidate "$candidate_path" \
                --baseline ci/gauntlet-baseline.json \
                --evidence "raw_summary=$artifact_dir/raw-summary.json" \
                --evidence "results=$artifact_dir/results.jsonl" \
                --evidence "runner_stderr=$artifact_dir/runner.stderr" \
                --evidence "command=$artifact_dir/command.txt" \
                --evidence "stats=$artifact_dir/make-stats.txt" \
                --evidence "case_index=$artifact_dir/case-index.json" \
                --evidence "entrypoint_command=$artifact_dir/entrypoint-command.txt" \
                --evidence "run_metadata=$artifact_dir/run-metadata.json" \
                --evidence "pipelock_release=$artifact_dir/pipelock-release.json" \
                --evidence "release_checksums=$artifact_dir/checksums.txt" \
                --evidence "pipelock_version_output=$artifact_dir/pipelock-version.txt" \
                --evidence "corpus_manifest=$artifact_dir/corpus-manifest.txt" \
                --evidence "tool_profile=$artifact_dir/tool-profile.json" \
                --evidence "capability_registry=$artifact_dir/capability-registry.json" \
                --evidence "receipt_profile=$artifact_dir/receipt-profile.json" \
                --evidence "execution_decision=$artifact_dir/execution-decision.json" \
                --evidence "run_bundle=$artifact_dir/run-bundle.json" \
                --decision "$decision_path"
            else
              temporary_decision="$decision_path.tmp"
              jq -n '{
                schema_version: 1,
                candidate_sha256: null,
                baseline_sha256: null,
                evidence_sha256: {},
                blocked: true,
                promotion_status: "blocked",
                failures: ["repository evaluator unavailable after an earlier workflow failure"],
                review_notes: []
              }' > "$temporary_decision"
              mv "$temporary_decision" "$decision_path"
            fi
          fi
          {
            echo "DECISION_PATH=$decision_path"
            echo "ARTIFACT_JSON=$candidate_path"
          } >> "$GITHUB_ENV"

      - name: Upload provenance artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: continuous-gauntlet-pipelock-${{ github.run_attempt }}
          path: |
            ${{ env.GAUNTLET_ARTIFACT_DIR }}/continuous-gauntlet-pipelock.json
            ${{ env.GAUNTLET_ARTIFACT_DIR }}/promotion-decision.json
            ${{ env.GAUNTLET_ARTIFACT_DIR }}/execution-decision.json
            ${{ env.GAUNTLET_ARTIFACT_DIR }}/run-bundle.json
            ${{ env.GAUNTLET_ARTIFACT_DIR }}/run-metadata.json
            ${{ env.GAUNTLET_ARTIFACT_DIR }}/pipelock-release.json
            ${{ env.GAUNTLET_ARTIFACT_DIR }}/pipelock-version.txt
            ${{ env.GAUNTLET_ARTIFACT_DIR }}/corpus-manifest.txt
            ${{ env.GAUNTLET_ARTIFACT_DIR }}/checksums.txt
            ${{ env.GAUNTLET_ARTIFACT_DIR }}/entrypoint-command.txt
            ${{ env.GAUNTLET_ARTIFACT_DIR }}/raw-summary.json
            ${{ env.GAUNTLET_ARTIFACT_DIR }}/results.jsonl
            ${{ env.GAUNTLET_ARTIFACT_DIR }}/runner.stderr
            ${{ env.GAUNTLET_ARTIFACT_DIR }}/command.txt
            ${{ env.GAUNTLET_ARTIFACT_DIR }}/make-stats.txt
            ${{ env.GAUNTLET_ARTIFACT_DIR }}/case-index.json
            ${{ env.GAUNTLET_ARTIFACT_DIR }}/tool-profile.json
            ${{ env.GAUNTLET_ARTIFACT_DIR }}/capability-registry.json
            ${{ env.GAUNTLET_ARTIFACT_DIR }}/receipt-profile.json
          retention-days: 14

      # Enforce only after upload. A regression must leave the candidate and
      # its reason available for review instead of disappearing when CI turns red.
      - name: Enforce candidate decision
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          test -n "${DECISION_PATH:-}" || { echo "candidate decision was not produced" >&2; exit 1; }
          test -n "${ARTIFACT_JSON:-}" || { echo "candidate artifact was not produced" >&2; exit 1; }
          artifact_dir="$GAUNTLET_ARTIFACT_DIR"
          decision_exit=0
          python3 scripts/evaluate_gauntlet_candidate.py enforce "$DECISION_PATH" \
            --candidate "$ARTIFACT_JSON" \
            --baseline ci/gauntlet-baseline.json \
            --result "$artifact_dir/enforcement-result.json" \
            --evidence "raw_summary=$artifact_dir/raw-summary.json" \
            --evidence "results=$artifact_dir/results.jsonl" \
            --evidence "runner_stderr=$artifact_dir/runner.stderr" \
            --evidence "command=$artifact_dir/command.txt" \
            --evidence "stats=$artifact_dir/make-stats.txt" \
            --evidence "case_index=$artifact_dir/case-index.json" \
            --evidence "entrypoint_command=$artifact_dir/entrypoint-command.txt" \
            --evidence "run_metadata=$artifact_dir/run-metadata.json" \
            --evidence "pipelock_release=$artifact_dir/pipelock-release.json" \
            --evidence "release_checksums=$artifact_dir/checksums.txt" \
            --evidence "pipelock_version_output=$artifact_dir/pipelock-version.txt" \
            --evidence "corpus_manifest=$artifact_dir/corpus-manifest.txt" \
            --evidence "tool_profile=$artifact_dir/tool-profile.json" \
            --evidence "capability_registry=$artifact_dir/capability-registry.json" \
            --evidence "receipt_profile=$artifact_dir/receipt-profile.json" \
            --evidence "execution_decision=$artifact_dir/execution-decision.json" \
            --evidence "run_bundle=$artifact_dir/run-bundle.json" || decision_exit=$?
          exit "$decision_exit"

      - name: Render owner-facing run summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$GAUNTLET_ARTIFACT_DIR"
          mkdir -p "$artifact_dir"
          candidate_path="${ARTIFACT_JSON:-$artifact_dir/continuous-gauntlet-pipelock.json}"
          decision_path="${DECISION_PATH:-$artifact_dir/promotion-decision.json}"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          summary_path="$artifact_dir/owner-summary.md"
          summary_exit=0
          if [[ -f scripts/render_gauntlet_run_summary.py ]]; then
            python3 scripts/render_gauntlet_run_summary.py \
              --candidate "$candidate_path" \
              --decision "$decision_path" \
              --baseline ci/gauntlet-baseline.json \
              --enforcement-result "$artifact_dir/enforcement-result.json" \
              --repository "$GITHUB_REPOSITORY" \
              --run-url "$run_url" > "$summary_path" || summary_exit=$?
            if [[ ! -s "$summary_path" ]]; then
              summary_exit=1
            fi
          else
            summary_exit=1
          fi
          if (( summary_exit != 0 )) && [[ ! -s "$summary_path" ]]; then
            {
              echo '## Continuous Gauntlet: BLOCKED — ACTION REQUIRED'
              echo
              echo 'The owner summary could not be rendered after an earlier workflow failure. The archived record in this repository is unchanged.'
            } > "$summary_path"
          fi
          cat "$summary_path" >> "$GITHUB_STEP_SUMMARY"
          exit "$summary_exit"

      - name: Upload owner review artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: continuous-gauntlet-owner-review-${{ github.run_attempt }}
          path: |
            ${{ env.GAUNTLET_ARTIFACT_DIR }}/enforcement-result.json
            ${{ env.GAUNTLET_ARTIFACT_DIR }}/owner-summary.md
          retention-days: 14
