name: Scorecard

# Scorecard runs separately from pull-request CodeQL analysis because its
# authenticated publication uses default-branch events and an OIDC token.
on:
  branch_protection_rule:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0' # Weekly Sunday 3AM UTC

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # No security-events: write. This job does not upload SARIF to code
      # scanning. It does still upload results.sarif as a build artifact below.
      # id-token is required because publish_results uses GitHub's OIDC token to
      # verify the result's authenticity when publishing it.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      # Scorecard measures repository practices. Publish its results to the
      # Scorecard API and retain SARIF as an artifact, without uploading those
      # repository-practice grades as code-scanning alerts.
