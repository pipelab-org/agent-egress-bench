name: Scorecard

# OpenSSF Scorecard runs in its own workflow rather than alongside CodeQL,
# because the two want different triggers and mixing them is visible to every
# contributor.
#
# The action documents `push` and `schedule` as its supported triggers, default
# branch only, and marks `pull_request` experimental. Its own reference workflow
# in ossf/scorecard uses exactly `push` to the default branch plus a weekly
# schedule. Publishing also needs `id-token: write` so the result can be
# authenticated with GitHub's OIDC token, which a pull request from a fork
# cannot supply.
#
# Living inside the pull-request-triggered Security workflow, this job had to
# disable itself with `if: github.event_name != 'pull_request'`. That is correct
# behavior and it renders as a permanent "Security / scorecard  Skipped" check
# on every pull request. A skipped check reads like something failed to run and
# invites a contributor to go looking for the breakage. Giving the job the
# triggers it actually supports removes the condition and the phantom check
# together, and changes nothing about when Scorecard really runs.
on:
  branch_protection_rule:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0' # Weekly Sunday 3AM UTC

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # No security-events: write. This job does not upload SARIF to code
      # scanning. It does still upload results.sarif as a build artifact below.
      # id-token is required because publish_results uses GitHub's OIDC token to
      # verify the result's authenticity when publishing it.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      # Scorecard results are NOT uploaded to code scanning, deliberately.
      #
      # Scorecard grades repository practice: pinned dependencies, branch
      # protection, what share of pull requests carried an approving review.
      # Code scanning is the surface for defects in this repository's code, and
      # routing a grade into it files each check as a dismissible alert with a
      # severity attached.
      #
      # Those alerts also do not stay dismissed. GitHub matches results across
      # uploads by rule and fingerprint, and a Scorecard result whose identity
      # shifts arrives as a NEW alert that a previous dismissal does not cover.
      # The outcome was a standing queue of security-labelled items that no code
      # change could close.
      #
      # The results remain public and retrievable: publish_results above sends
      # them to the OpenSSF Scorecard API that backs the badge and the public
      # viewer, and the artifact above keeps the raw SARIF. This narrows where
      # the grade is displayed. It does not withhold it.
