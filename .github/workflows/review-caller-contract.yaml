name: Review caller contract

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/agent-review.yaml'
      - '.github/agent-review.toml'
      - '.github/workflows/review-caller-contract.yaml'
      - 'scripts/check_agent_review_workflow.py'
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/agent-review.yaml'
      - '.github/agent-review.toml'
      - '.github/workflows/review-caller-contract.yaml'
      - 'scripts/check_agent_review_workflow.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-review.yaml'
      - '.github/agent-review.toml'
      - '.github/workflows/review-caller-contract.yaml'
      - 'scripts/check_agent_review_workflow.py'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the caller validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Bootstrap tests run proposed code without secrets. Target validation
          # always runs the default-branch copy, independently of proposed code.
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: true
          path: trusted-validator
          persist-credentials: false
          sparse-checkout: scripts/check_agent_review_workflow.py
          sparse-checkout-cone-mode: false
      - name: Check out proposed policy as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: true
          path: proposed
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/agent-review.yaml
            .github/agent-review.toml
            .github/workflows/review-caller-contract.yaml
          sparse-checkout-cone-mode: false
      - name: Check approved source and checking workflow before loading shared code
        id: policy
        run: python3 -I trusted-validator/scripts/check_agent_review_workflow.py --root proposed --output "$GITHUB_OUTPUT"
      - name: Check out the approved immutable shared validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pipelab-org/agent-review
          ref: ${{ steps.policy.outputs.reviewer_sha }}
          path: trusted-reviewer
          persist-credentials: false
          sparse-checkout: scripts/agent_review_contract.py
          sparse-checkout-cone-mode: false
      - name: Validate caller and profile with approved shared code
        env:
          REVIEW_SOURCE_SHA: ${{ steps.policy.outputs.reviewer_sha }}
        run: |
          python3 -I - <<'PYCODE'
          import os
          import pathlib
          import runpy

          contract = runpy.run_path("trusted-reviewer/scripts/agent_review_contract.py")
          root = pathlib.Path("proposed")
          contract["validate_caller"](
              root / ".github/workflows/agent-review.yaml", os.environ["REVIEW_SOURCE_SHA"],
          )
          contract["load_profile"](root / ".github/agent-review.toml")
          print("Review caller and profile contract passed")
          PYCODE
