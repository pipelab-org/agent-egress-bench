name: Validate Cases

on:
  # Promotion branches are created with GITHUB_TOKEN, which intentionally does
  # not emit a pull_request workflow run. The promotion workflow explicitly
  # dispatches this trusted workflow against the resulting branch instead.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Do NOT give this job a display `name:`. The check reports under the display
  # name when one is set, and `validate` is a required status check, so renaming
  # it leaves the requirement permanently unsatisfied and the pull request
  # unmergeable.
  validate:
    runs-on: ubuntu-latest
    # Raised from 10 after this job gained a real GoReleaser build. Measured on
    # run 2026-08-15T15:09Z it takes 5m19s, against roughly 3m before, so half
    # the old budget is now spent and a loaded runner would start cancelling a
    # job that is working correctly. A cancelled release-layout check reads as a
    # failure nobody can reproduce locally.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the validation scope
        id: scope
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request) validation_base="$PR_BASE_SHA" ;;
            push) validation_base="$PUSH_BEFORE_SHA" ;;
            workflow_dispatch) validation_base="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)" ;;
            *) echo "unsupported validation event: $GITHUB_EVENT_NAME" >&2; exit 1 ;;
          esac
          python3 scripts/ci_scope.py --base "$validation_base" --github-output "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.workflow_only != 'true'
        with:
          # runner/go.mod requires Go 1.26; this toolchain also builds validate
          # and the receipt generator covered by the shared local preflight.
          go-version: "1.26"

      - name: Install pinned GoReleaser for release archive integration
        if: steps.scope.outputs.workflow_only != 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Run local preflight gate
        if: steps.scope.outputs.workflow_only != 'true'
        run: make preflight

      - name: Verify pinned GoReleaser archive layout
        if: steps.scope.outputs.workflow_only != 'true'
        run: make test-release-snapshot

      - name: Test workflow contracts without rebuilding the corpus
        if: steps.scope.outputs.workflow_only == 'true'
        run: make test-workflows

      - name: Enforce append-only Gauntlet history
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request) immutable_base="$PR_BASE_SHA" ;;
            push) immutable_base="$PUSH_BEFORE_SHA" ;;
            workflow_dispatch) immutable_base="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)" ;;
            *) echo "unsupported validation event: $GITHUB_EVENT_NAME" >&2; exit 1 ;;
          esac
          python3 scripts/validate_gauntlet_records.py --immutable-base "$immutable_base"

  # `runner` is a required status check. Keep the job so the requirement stays
  # satisfiable; the preflight target above already covers these tests, so this
  # is a narrow re-assertion rather than the primary gate.
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Run runner tests
        run: cd runner && go test -race -count=1 ./...

  # Coverage is telemetry for the README badge. It must not become a required
  # status check: an uploader hiccup cannot block a green validate/runner job.
  # Promotion dispatches this workflow with GITHUB_TOKEN; skip coverage there.
  coverage:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Collect Go coverage
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/pipelock-tmp" "$HOME/.cache/go-build"
          export TMPDIR="$HOME/.cache/pipelock-tmp"
          export GOCACHE="$HOME/.cache/go-build"
          for module in runner validate capability-registry; do
            ( cd "$module" && go test -race -count=1 -coverprofile=coverage.out ./... )
          done

      - name: Upload coverage
        # Best-effort telemetry. The Codecov uploader's integrity check can
        # fail independently of the tests, and coverage is not a merge gate.
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: runner/coverage.out,validate/coverage.out,capability-registry/coverage.out
          disable_search: true
          fail_ci_if_error: false
          # Codecov stopped accepting unauthenticated uploads from this repo:
          # every push logged "Token required - not valid tokenless upload" and
          # the README badge read "unknown" while the tests were green. The job
          # already requests `id-token: write`, so OIDC authenticates the upload
          # without storing a long-lived secret.
          use_oidc: true

  # The shared gate above is the normal push contract. Keep this narrower job
  # solely for the validate module's declared minimum Go compatibility, which
  # the Go 1.26 preflight cannot prove.
  validate-min-go:
    name: Validate minimum Go version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"

      - name: Test validate module at its declared minimum
        run: |
          mkdir -p "$HOME/.cache/pipelock-tmp" "$HOME/.cache/go-build"
          cd validate
          TMPDIR="$HOME/.cache/pipelock-tmp" GOCACHE="$HOME/.cache/go-build" go test -race -count=1 ./...

  govulncheck:
    name: Known vulnerabilities in called code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pinned toolchain of the result-producing lane, so this job fails on
      # exactly the exposure a published Gauntlet run would have carried. Keep
      # this in step with continuous-gauntlet.yaml.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"

      - name: Scan both modules for called vulnerabilities
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          status=0
          for module in runner validate; do
            echo "::group::govulncheck $module"
            ( cd "$module" && "$(go env GOPATH)/bin/govulncheck" ./... ) || status=1
            echo "::endgroup::"
          done
          exit "$status"
