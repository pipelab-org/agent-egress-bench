name: Repository secret scan (self-run)

# Named for what it does rather than for the product that does it. This
# repository maintains a corpus used to evaluate agent egress tools, and the
# scanner here is the maintainer's own product, so a check reading
# "Pipelock self-scan / security-scan" on every pull request invites the
# conclusion that the evaluated tool gates the evaluation. It does not: this job
# is repository hygiene, it scans this repository's own files for secrets, and it
# awards nothing to any tool including the one it runs. The scanner's identity is
# visible in the job log and pinned in the step below rather than announced in
# the check name.
#
# The job id stays `security-scan` deliberately. It is the required-status-check
# context in this repository's `main` ruleset, so renaming it here without editing
# that ruleset first would leave every pull request waiting on a context that can
# never report. Changing it is a two-step repository-admin operation: add the new
# context, land the rename, then drop the old one.

on:
  # Promotion pull requests are created with GITHUB_TOKEN, which intentionally
  # does not emit a pull_request workflow run. The promotion workflow explicitly
  # dispatches this trusted workflow against the generated branch instead.
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The action runs the whole-tree audit and resolves the shared config, but
      # its built-in diff scan is disabled here. Pin the action release and the
      # scanner source together so generated config cannot drift beyond what the
      # scanner parses. Advance both producers through a reviewed change.
      - name: Pipelock Scan
        id: pipelock
        uses: luckyPipewrench/pipelock@3e868ac5d5b62d3a2790958542171143af8a0e38 # v3.6.0
        with:
          version: '3.6.0'
          scan-diff: 'false'
          fail-on-findings: 'true'
          test-vectors: 'false'
          # governance/case-decisions/ holds generated records that quote each case's own
          # description, and this corpus documents attacks: one case carries AWS's published
          # example key, which is a real AWS Access ID shape. cases/ is excluded for that same
          # reason and a record derived from a case inherits it. Scoped to the generated
          # directory so hand-written governance material stays scanned.
          exclude-paths: |
            cases/
            governance/case-decisions/
            README.md
            scripts/
            runner/go.sum
            control-evidence/v0/conformance/*/*/*.dsse.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          cache: false

      # Pinned to an immutable commit rather than a branch. A moving `@main`
      # would let any later commit on Pipelock change or disable this
      # repository's secret gate with no reviewed change here. Advance this pin
      # through a normal reviewed pull request when a scanner fix is needed.
      # This commit is the reviewed v3.6.0 release.
      - name: Build scanner from pinned Pipelock commit
        shell: bash
        env:
          PIPELOCK_REV: 3e868ac5d5b62d3a2790958542171143af8a0e38
        run: |
          set -euo pipefail
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/luckyPipewrench/pipelock/cmd/pipelock@${PIPELOCK_REV}"
          # Prepend so the plain `pipelock` command below resolves to this
          # build rather than the release the action installed earlier.
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/pipelock" --version

      - name: Scan pull request diff
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONFIG_PATH: ${{ steps.pipelock.outputs['config-path'] }}
        run: |
          set -euo pipefail
          diff_file="$(mktemp)"
          trap 'rm -f "$diff_file"' EXIT
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          # --text forces textual output so a path marked binary by an in-repo
          # .gitattributes cannot reduce its content to "Binary files differ"
          # and slip past the scanner unread.
          git diff --no-ext-diff --no-textconv --text \
            "$merge_base" "$HEAD_SHA" > "$diff_file"
          scan_args=(
            --exclude cases/
            --exclude governance/case-decisions/
            --exclude README.md
            --exclude scripts/
            --exclude runner/go.sum
            --exclude 'control-evidence/v0/conformance/*/*/*.dsse.json'
          )
          if [[ -n "$CONFIG_PATH" && -f "$CONFIG_PATH" ]]; then
            scan_args+=(--config "$CONFIG_PATH")
          fi
          pipelock git scan-diff "${scan_args[@]}" < "$diff_file"

      - name: Scan dispatched branch diff
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CONFIG_PATH: ${{ steps.pipelock.outputs['config-path'] }}
        run: |
          set -euo pipefail
          diff_file="$(mktemp)"
          trap 'rm -f "$diff_file"' EXIT
          git diff --no-ext-diff --no-textconv --text \
            "origin/$DEFAULT_BRANCH...HEAD" > "$diff_file"
          scan_args=(
            --exclude cases/
            --exclude governance/case-decisions/
            --exclude README.md
            --exclude scripts/
            --exclude runner/go.sum
            --exclude 'control-evidence/v0/conformance/*/*/*.dsse.json'
          )
          if [[ -n "$CONFIG_PATH" && -f "$CONFIG_PATH" ]]; then
            scan_args+=(--config "$CONFIG_PATH")
          fi
          pipelock git scan-diff "${scan_args[@]}" < "$diff_file"
