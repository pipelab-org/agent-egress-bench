name: Release benchmark artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'

      - name: Run repository release gates
        shell: bash
        run: make preflight

      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Build and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            release_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
            ./scripts/release-build.sh --tag "$GITHUB_REF_NAME" --commit "$release_commit"
          else
            ./scripts/release-build.sh --tag snapshot --commit "$GITHUB_SHA" --snapshot
          fi

      - name: Upload release artifacts for inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-egress-bench-release-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  rehearse-image:
    needs: release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1

      - name: Download the rehearsal release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-egress-bench-release-${{ github.sha }}
          path: dist/release

      - name: Build and bind the no-publish runner image
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("dist/release/release-identity.json"))["release"]["version"])')"
          release_commit="$(python3 -c 'import json; print(json.load(open("dist/release/release-identity.json"))["source"]["commit"])')"
          [[ "$release_commit" == "$GITHUB_SHA" ]]
          local_image="aeb-release-rehearsal:$GITHUB_SHA"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "AEB_VERSION=$version" \
            --build-arg "AEB_COMMIT=$release_commit" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$release_commit" \
            --load \
            --tag "$local_image" \
            .
          reported_version="$(docker run --rm "$local_image" --version)"
          [[ "$reported_version" == "aeb-gauntlet $version $release_commit" ]]
          python3 scripts/release_build.py verify --release-dir dist/release --repo-root . --repository "$GITHUB_REPOSITORY"

      - name: Upload the no-publish final asset set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-egress-bench-release-rehearsal-final-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  rehearse-draft:
    needs: [release, rehearse-image]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the no-publish final asset set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-egress-bench-release-rehearsal-final-${{ github.sha }}
          path: dist/release

      - name: Rehearse verified draft creation without calling GitHub
        shell: bash
        run: python3 scripts/release_publish.py --tag snapshot --dist dist/release --dry-run

  attest:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-egress-bench-release-${{ github.sha }}
          path: dist/release

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*

  image:
    needs: [release, attest]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1

      - name: Confirm the installed builder version
        shell: bash
        run: docker buildx version | grep -F 'v0.36.1'

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - id: publish
        name: Build and publish the multi-architecture runner image
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          release_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          image_repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agent-egress-bench-runner"
          image="$image_repository:$GITHUB_REF_NAME"
          metadata_file="$RUNNER_TEMP/aeb-image-metadata.json"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "AEB_VERSION=$version" \
            --build-arg "AEB_COMMIT=$release_commit" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$release_commit" \
            --provenance=mode=max \
            --sbom=true \
            --tag "$image" \
            --metadata-file "$metadata_file" \
            --push \
            .
          digest="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$metadata_file")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          pinned_image="${image%:*}@$digest"
          docker buildx imagetools inspect --raw "$pinned_image" > "$RUNNER_TEMP/aeb-image-index.json"
          python3 - "$RUNNER_TEMP/aeb-image-index.json" <<'PY'
          import json
          import sys

          index = json.load(open(sys.argv[1], encoding="utf-8"))
          platforms = {
              (manifest.get("platform", {}).get("os"), manifest.get("platform", {}).get("architecture"))
              for manifest in index.get("manifests", [])
          }
          required = {("linux", "amd64"), ("linux", "arm64")}
          if not required.issubset(platforms):
              raise SystemExit(f"runner image is missing required platforms: {sorted(required - platforms)}")
          PY
          reported_version="$(docker run --rm --platform linux/amd64 "$pinned_image" --version)"
          [[ "$reported_version" == "aeb-gauntlet $version $release_commit" ]]
          echo "repository=$image_repository" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=$pinned_image" >> "$GITHUB_OUTPUT"
          identity_dir="$RUNNER_TEMP/aeb-runner-image"
          mkdir -p "$identity_dir"
          printf '%s\n' "$pinned_image" > "$identity_dir/runner-image.ref"
          echo "Runner image: $pinned_image" >> "$GITHUB_STEP_SUMMARY"
          echo "Installed runner: $reported_version" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest the published runner image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Log out of GitHub Container Registry
        if: ${{ always() }}
        run: docker logout ghcr.io

      - name: Verify the published image from an anonymous cold client
        shell: bash
        env:
          RUNNER_IMAGE: ${{ steps.publish.outputs.ref }}
        run: |
          set -euo pipefail
          anonymous_config="$RUNNER_TEMP/aeb-anonymous-docker"
          mkdir -p "$anonymous_config"
          printf '{}\n' > "$anonymous_config/config.json"
          docker image rm "$RUNNER_IMAGE" >/dev/null 2>&1 || true
          if docker image inspect "$RUNNER_IMAGE" >/dev/null 2>&1; then
            echo "runner image remained in the local image store before the anonymous pull" >&2
            exit 1
          fi
          DOCKER_CONFIG="$anonymous_config" docker pull "$RUNNER_IMAGE"
          version="${GITHUB_REF_NAME#v}"
          release_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          reported_version="$(DOCKER_CONFIG="$anonymous_config" docker run --rm --platform linux/amd64 "$RUNNER_IMAGE" --version)"
          [[ "$reported_version" == "aeb-gauntlet $version $release_commit" ]]

      - name: Download verified release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-egress-bench-release-${{ github.sha }}
          path: dist/release

      - name: Bind the runner image identity into the release checksums
        shell: bash
        run: |
          set -euo pipefail
          identity_dir="$RUNNER_TEMP/aeb-runner-image"
          cp "$identity_dir/runner-image.ref" dist/release/runner-image.ref
          cp dist/release/release-identity.json "$RUNNER_TEMP/release-identity.json"
          python3 scripts/release_build.py checksums --identity "$RUNNER_TEMP/release-identity.json" --dist dist/release
          python3 scripts/release_build.py verify --release-dir dist/release --repo-root . --repository "$GITHUB_REPOSITORY"

      - name: Attest the final release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*

      - name: Upload the final verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-egress-bench-release-final-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: [release, attest, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-egress-bench-release-final-${{ github.sha }}
          path: dist/release

      - name: Create an owned verified draft or resume one on workflow retry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/release_publish.py --tag "$GITHUB_REF_NAME" --dist dist/release
